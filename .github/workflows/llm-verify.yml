# G-PR 본체 (재사용 워크플로)
#
# 각 저장소의 .github/workflows/llm-verify.yml 이 이것을 호출한다.
# 실행 순서의 설명은 fresh-market/fm-backend 의 docs/verification/verification-workflow.md 에 있다.
#
# 이 게이트는 병합을 막지 않는다. 재현율이 측정되지 않았기 때문이다.
# 차단은 G-BUILD(커버리지, Blocker)와 G-RELEASE 가 한다.

name: LLM 검증 (G-PR)

on:
  workflow_call:
    inputs:
      common_repo:
        type: string
        default: fresh-market/.github
      # 판정 도구를 브랜치 판본으로 돌려보기 위한 것이다.
      #
      # 아래 "도구만 최신으로 둔다" 단계가 common 의 기본 브랜치에서 run.py 를 가져오므로,
      # uses 만 브랜치로 바꿔도 워크플로만 그쪽에서 오고 도구는 main 것이 온다.
      # 그러면 엔진을 바꾸는 변경은 main 에 넣기 전에 실제 호출로 확인할 방법이 없다.
      # 브랜치 이름을 주면 그 판본으로 한 번 돌려보고 판단할 수 있다.
      # 비워 두면 기본 브랜치를 쓴다. 상시 운영에서는 비워 둔다.
      common_ref:
        type: string
        default: ""
      infra_repo:
        type: string
        default: fresh-market/fm-infra
      # 다른 저장소 항목까지 판정한다.
      #
      # 끄면 대상 저장소 자신의 항목만 본다. backend PR 이면 backend 276건이고,
      # common 의 품질 속성과 infra 의 인프라 제약은 아무도 강제로 보지 않는다.
      # 켜면 615건이 되고 호출이 1회에서 2회로 는다.
      #
      # 켜면 run.py 의 CI_STAGES 도 함께 덮여 두 단계가 다 열린다. backend 의
      # pr-gate.yml 이 켜고 있으므로 CI 는 이미 2단계까지 판정한다.
      full:
        type: boolean
        default: false
    secrets:
      # 인증 경로가 둘이고 지갑이 다르다. 있는 쪽을 쓴다.
      #
      # GEMINI_CREDS_JSON  Google 계정 구독으로 쓴다. 사람이 gemini 에 로그인해 만든 파일이다
      # GEMINI_API_KEY     AI Studio 종량 과금이다. 만료가 없는 대신 크레딧이 필요하다
      #
      # 구독 경로를 먼저 본다. 이 저장소가 Gemini CLI 로 갈아탄 이유가 구독 한도라서,
      # 키가 함께 들어 있을 때 종량 과금으로 새면 갈아탄 뜻이 사라진다.
      # 사람이 로컬에서 로그인해 만든 ~/.gemini/oauth_creds.json 을 그대로 넣는다
      GEMINI_CREDS_JSON:
        required: false
      GEMINI_API_KEY:
        required: false
      # 과도기 선언이다. 판정 엔진이 Codex 였을 때 부르던 이름이고 지금은 쓰지 않는다.
      # 이미 열려 있는 PR 들은 각자 브랜치의 옛 pr-gate.yml 을 쓰는데 그것이 이 이름을 넘긴다.
      # 선언을 지우면 "선언되지 않은 시크릿" 으로 그 PR 들의 게이트가 통째로 죽는다.
      # 열려 있던 PR 이 모두 닫히거나 리베이스되면 이 두 줄을 지운다.
      CODEX_AUTH_JSON:
        required: false
      OPENAI_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # --- 3단계: 체크아웃 (판정 대상) ---
      - name: 판정 대상 저장소
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: 범위와 기준 시점 산출          # 4단계
        id: scope
        working-directory: target
        env:
          # actions/checkout 은 PR ref 만 가져오므로 origin/<base_ref> 가 없을 수 있다.
          # 이벤트가 주는 SHA 를 쓰면 merge-base 계산 없이 확정된다
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "head=$HEAD_SHA" >> $GITHUB_OUTPUT
          # 기준 저장소는 시점으로 고정한다 (qa-llm-verification.md 2.2절).
          # PR 이 갈라져 나온 시점의 점검 항목으로 판정해야, 심사 중 기준이 바뀌어
          # 고치지 않은 코드에 새 위반이 생기는 일을 막는다.
          echo "at=$(git show -s --format=%cI "$BASE")" >> $GITHUB_OUTPUT

      # --- 3단계: 체크아웃 (판정 기준) ---
      - name: 기준 저장소 common
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.common_repo }}
          ref: ${{ inputs.common_ref }}
          path: common
          fetch-depth: 0

      # 판정 기준은 시점을 고정하고 판정 도구는 고정하지 않는다.
      #
      # 기준(items.yml, 가이드 문서)을 고정하는 이유는 2.2절에 있다. 심사 중 기준이 바뀌면
      # 고치지 않은 코드에 새 위반이 생긴다.
      # 도구(run.py)까지 함께 고정하면, 도구의 버그를 고쳐도 그 전에 갈라져 나온 PR 은
      # 계속 같은 버그로 실패한다. 고칠 방법이 PR 을 다시 만드는 것밖에 없어진다.
      - name: common 을 기준 시점으로 고정하고 도구만 최신으로 둔다
        working-directory: common
        run: |
          LATEST=$(git rev-parse HEAD)
          SHA=$(git rev-list -1 --before="${{ steps.scope.outputs.at }}" HEAD)
          git checkout -q "$SHA"
          git checkout -q "$LATEST" -- .github/llm-verify/
          git checkout -q "$SHA" -- .github/llm-verify/items.yml \
                                    .github/llm-verify/known-conflicts.yml
          echo "기준 @ $SHA"
          echo "도구 @ $LATEST"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      # 판정 엔진. 버전을 고정한다.
      #
      # 에이전트 CLI 는 판올림으로 기본 모델과 출력이 바뀔 수 있어 도구 버전이 곧 판정 기준이다.
      # 고정하지 않으면 같은 커밋을 다시 돌렸을 때 결과가 달라져도 원인을 짚을 수 없다.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @google/gemini-cli@0.61.0

      # 인증은 여기서 한 번만 준비한다. run.py 는 CLI 가 이미 인증돼 있다고 보고 부른다.
      # 러너는 일회성이라 자격증명이 잡 종료와 함께 사라진다.
      #
      # CLI 는 대화 없이 돌 때 환경 변수로 인증 방식을 고른다. 순서가 코드에 박혀 있고
      # GOOGLE_GENAI_USE_GCA 가 GEMINI_API_KEY 보다 먼저다. 그래서 구독 경로를 쓸 때는
      # GEMINI_API_KEY 를 아예 내보내지 않는다. 둘 다 있으면 지갑이 어느 쪽인지 흐려진다.
      #
      # 구독 경로는 자격증명 파일을 놓는 것으로 끝난다. gemini 에 비대화 로그인 플래그가
      # 없어서 CLI 가 스스로 읽는 자리에 직접 놓는다. 그 자리는 ~/.gemini/oauth_creds.json 이고
      # 코드에 박혀 있어 다른 경로로 돌릴 수 없다.
      #
      # 액세스 토큰이 만료돼 있어도 된다. 파일에 리프레시 토큰이 함께 들어 있으면 CLI 가
      # 첫 호출에서 스스로 갱신한다. 그 갱신분은 러너 안에만 남고 잡과 함께 사라진다.
      #
      # 여기서는 구독 경로만 준비하고 API 키는 손대지 않는다. 키는 판정 스텝의 env 로 바로
      # 넘긴다. GITHUB_ENV 에 적으면 키가 파일을 한 번 거치게 되는데, 그 파일은 다음 스텝
      # 전부에 실리고 로그 마스킹은 우리가 적은 이름이 아니라 시크릿 값에만 걸린다.
      - name: Gemini 인증
        env:
          GEMINI_CREDS_JSON: ${{ secrets.GEMINI_CREDS_JSON }}
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ -n "$GEMINI_CREDS_JSON" ]; then
            mkdir -p "$HOME/.gemini"
            printenv GEMINI_CREDS_JSON > "$HOME/.gemini/oauth_creds.json"
            chmod 600 "$HOME/.gemini/oauth_creds.json"
            echo "GOOGLE_GENAI_USE_GCA=true" >> "$GITHUB_ENV"
            echo "인증 경로: Google 계정 구독"
          elif [ "$HAS_KEY" = "true" ]; then
            echo "인증 경로: AI Studio API 키"
          else
            echo "::error::GEMINI_CREDS_JSON 도 GEMINI_API_KEY 도 없다"
            exit 1
          fi

      # --- 5, 6단계: 앵커 규칙 매칭 ---
      # 어떤 규칙이 걸렸는지 로그에 남긴다. 판정은 judge 스텝이 다시 계산한다
      - name: 앵커 규칙 매칭
        id: match
        run: |
          python common/.github/llm-verify/run.py --mode match \
            --backend target \
            --base ${{ steps.scope.outputs.base }} \
            --head ${{ steps.scope.outputs.head }}

      # infra 는 조건 없이 받는다.
      # needs_baseline 이 false 인 규칙(entity, api-contract, build)도 INF 항목을 켜므로,
      # 조건부로 받으면 그 항목들이 레지스트리에서 통째로 빠진다.
      # 빠진 항목은 UNJUDGED 로도 안 남아 아무도 사라진 줄 모른다.
      # needs_baseline 은 확정값 문서를 프롬프트에 넣을지만 정한다 (run.py 안에서).
      - name: 기준 저장소 infra
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo }}
          path: infra
          fetch-depth: 0

      - name: infra 를 기준 시점으로 고정
        working-directory: infra
        run: |
          SHA=$(git rev-list -1 --before="${{ steps.scope.outputs.at }}" HEAD)
          git checkout -q "$SHA"
          echo "infra @ $SHA"

      # --- 7~16단계 ---
      - name: 판정
        id: judge
        env:
          # 모델을 코드에 적는다. 판정 결과와 비용을 바꾸는 값이라 이력에 남아야 한다.
          #
          # 비워 두면 CLI 기본값을 쓰는데 그 기본값이 판올림마다 바뀐다.
          # 이 판정은 항목마다 근거 파일을 읽고 부재를 따져야 해서 flash 로는 모자란다.
          # 앵커 예산을 40만 바이트로 잡아 둔 것도 그 읽기를 전제한 값이다.
          #
          # 저장소 변수로 덮어쓸 수 있다. 모델을 비교할 때 쓴다.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
          # 구독 경로가 준비됐으면 CLI 가 GOOGLE_GENAI_USE_GCA 를 먼저 보므로 이 키는 안 쓰인다.
          # 인증 스텝이 둘 중 하나는 있다는 것을 이미 확인했다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python common/.github/llm-verify/run.py --mode judge \
            --backend target --common common --infra infra \
            --base ${{ steps.scope.outputs.base }} \
            --head ${{ steps.scope.outputs.head }} \
            ${{ inputs.full && '--full' || '' }} \
            --out verify-out.md

      # --- 16단계: 출력 ---
      #
      # 옛 판정 코멘트를 지우고 새로 단다.
      #
      # 갱신(PATCH)으로 두면 타임라인 위치가 안 움직여서, 판정이 새로 나와도 대화에
      # 아무 항목이 안 생기고 알림도 가지 않는다. 실제로 그것 때문에 갱신된 판정을
      # 몇 시간 전 것으로 오해하는 일이 있었다.
      #
      # 그렇다고 계속 쌓으면 옛 판정이 위에 남는다. GitHub 은 대화 탭 코멘트를
      # 항상 오래된 것부터 보여 주고 최신순 정렬을 제공하지 않는다.
      # 그래서 지우고 다시 단다. 항상 하나만 남고 그것이 맨 아래에 온다.
      #
      # 지난 판정 이력은 Actions 실행 기록과 Job Summary 에 남으므로 여기서 잃지 않는다.
      - name: 리뷰 코멘트
        if: always() && hashFiles('verify-out.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          for ID in $(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                        --jq '.[] | select(.body | startswith("<!-- llm-verify -->")) | .id'); do
            gh api --method DELETE "repos/$REPO/issues/comments/$ID" >/dev/null
            echo "옛 코멘트 삭제 $ID"
          done
          gh api --method POST "repos/$REPO/issues/$PR/comments" \
            -F body=@verify-out.md >/dev/null
          echo "코멘트 생성"

      - name: 요약
        if: always()
        run: cat verify-out.md >> $GITHUB_STEP_SUMMARY || true
