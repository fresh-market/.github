# G-PR 본체 (재사용 워크플로)
#
# 각 저장소의 .github/workflows/llm-verify.yml 이 이것을 호출한다.
# 실행 순서의 설명은 fresh-market/fm-backend 의 docs/verification/verification-workflow.md 에 있다.
#
# 이 게이트는 병합을 막지 않는다. 재현율이 측정되지 않았기 때문이다.
# 차단은 G-BUILD(커버리지, Blocker)와 G-RELEASE 가 한다.

name: LLM 검증 (G-PR)

on:
  workflow_call:
    inputs:
      common_repo:
        type: string
        default: fresh-market/.github
      infra_repo:
        type: string
        default: fresh-market/fm-infra
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # --- 3단계: 체크아웃 (판정 대상) ---
      - name: 판정 대상 저장소
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: 범위와 기준 시점 산출          # 4단계
        id: scope
        working-directory: target
        env:
          # actions/checkout 은 PR ref 만 가져오므로 origin/<base_ref> 가 없을 수 있다.
          # 이벤트가 주는 SHA 를 쓰면 merge-base 계산 없이 확정된다
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "head=$HEAD_SHA" >> $GITHUB_OUTPUT
          # 기준 저장소는 시점으로 고정한다 (qa-llm-verification.md 2.2절).
          # PR 이 갈라져 나온 시점의 점검 항목으로 판정해야, 심사 중 기준이 바뀌어
          # 고치지 않은 코드에 새 위반이 생기는 일을 막는다.
          echo "at=$(git show -s --format=%cI "$BASE")" >> $GITHUB_OUTPUT

      # --- 3단계: 체크아웃 (판정 기준) ---
      - name: 기준 저장소 common
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.common_repo }}
          path: common
          fetch-depth: 0

      # 판정 기준은 시점을 고정하고 판정 도구는 고정하지 않는다.
      #
      # 기준(items.yml, 가이드 문서)을 고정하는 이유는 2.2절에 있다. 심사 중 기준이 바뀌면
      # 고치지 않은 코드에 새 위반이 생긴다.
      # 도구(run.py)까지 함께 고정하면, 도구의 버그를 고쳐도 그 전에 갈라져 나온 PR 은
      # 계속 같은 버그로 실패한다. 고칠 방법이 PR 을 다시 만드는 것밖에 없어진다.
      - name: common 을 기준 시점으로 고정하고 도구만 최신으로 둔다
        working-directory: common
        run: |
          LATEST=$(git rev-parse HEAD)
          SHA=$(git rev-list -1 --before="${{ steps.scope.outputs.at }}" HEAD)
          git checkout -q "$SHA"
          git checkout -q "$LATEST" -- .github/llm-verify/
          git checkout -q "$SHA" -- .github/llm-verify/items.yml \
                                    .github/llm-verify/known-conflicts.yml
          echo "기준 @ $SHA"
          echo "도구 @ $LATEST"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      # 판정 엔진. 버전을 고정한다.
      #
      # 에이전트 CLI 는 판올림으로 기본 모델과 출력이 바뀔 수 있어 도구 버전이 곧 판정 기준이다.
      # 고정하지 않으면 같은 커밋을 다시 돌렸을 때 결과가 달라져도 원인을 짚을 수 없다.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @openai/codex@0.142.5

      # 로그인은 여기서 한 번만 한다. run.py 는 CLI 가 이미 인증돼 있다고 보고 부른다.
      # 러너는 일회성이라 자격증명이 잡 종료와 함께 사라진다.
      - name: Codex 로그인
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      # --- 5, 6단계: 앵커 규칙 매칭 ---
      # 어떤 규칙이 걸렸는지 로그에 남긴다. 판정은 judge 스텝이 다시 계산한다
      - name: 앵커 규칙 매칭
        id: match
        run: |
          python common/.github/llm-verify/run.py --mode match \
            --backend target \
            --base ${{ steps.scope.outputs.base }} \
            --head ${{ steps.scope.outputs.head }}

      # infra 는 조건 없이 받는다.
      # needs_baseline 이 false 인 규칙(entity, api-contract, build)도 INF 항목을 켜므로,
      # 조건부로 받으면 그 항목들이 레지스트리에서 통째로 빠진다.
      # 빠진 항목은 UNJUDGED 로도 안 남아 아무도 사라진 줄 모른다.
      # needs_baseline 은 확정값 문서를 프롬프트에 넣을지만 정한다 (run.py 안에서).
      - name: 기준 저장소 infra
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo }}
          path: infra
          fetch-depth: 0

      - name: infra 를 기준 시점으로 고정
        working-directory: infra
        run: |
          SHA=$(git rev-list -1 --before="${{ steps.scope.outputs.at }}" HEAD)
          git checkout -q "$SHA"
          echo "infra @ $SHA"

      # --- 7~16단계 ---
      - name: 판정
        id: judge
        env:
          # 모델을 비우면 CLI 기본값을 쓴다. 고정하려면 여기에 이름을 준다.
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
        run: |
          python common/.github/llm-verify/run.py --mode judge \
            --backend target --common common --infra infra \
            --base ${{ steps.scope.outputs.base }} \
            --head ${{ steps.scope.outputs.head }} \
            --out verify-out.md

      # --- 16단계: 출력 ---
      #
      # 옛 판정 코멘트를 지우고 새로 단다.
      #
      # 갱신(PATCH)으로 두면 타임라인 위치가 안 움직여서, 판정이 새로 나와도 대화에
      # 아무 항목이 안 생기고 알림도 가지 않는다. 실제로 그것 때문에 갱신된 판정을
      # 몇 시간 전 것으로 오해하는 일이 있었다.
      #
      # 그렇다고 계속 쌓으면 옛 판정이 위에 남는다. GitHub 은 대화 탭 코멘트를
      # 항상 오래된 것부터 보여 주고 최신순 정렬을 제공하지 않는다.
      # 그래서 지우고 다시 단다. 항상 하나만 남고 그것이 맨 아래에 온다.
      #
      # 지난 판정 이력은 Actions 실행 기록과 Job Summary 에 남으므로 여기서 잃지 않는다.
      - name: 리뷰 코멘트
        if: always() && hashFiles('verify-out.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          for ID in $(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                        --jq '.[] | select(.body | startswith("<!-- llm-verify -->")) | .id'); do
            gh api --method DELETE "repos/$REPO/issues/comments/$ID" >/dev/null
            echo "옛 코멘트 삭제 $ID"
          done
          gh api --method POST "repos/$REPO/issues/$PR/comments" \
            -F body=@verify-out.md >/dev/null
          echo "코멘트 생성"

      - name: 요약
        if: always()
        run: cat verify-out.md >> $GITHUB_STEP_SUMMARY || true
